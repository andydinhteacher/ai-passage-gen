<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Passage Generator - Mr. Anh Đinh</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thư viện React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel để biên dịch JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        .passage-font {
            font-family: "Segoe UI", "Tahoma", "Aptos", "Calibri", sans-serif;
            line-height: 1.8;
        }
        .btn-hover {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Cấu hình 3 giao diện chuyên biệt cho giáo dục & đọc hiểu chống chói mắt
        const THEMES = {
            'edu-blue': {
                id: 'edu-blue',
                shortLabel: 'Edu Blue',
                fullLabel: 'Academic Blue (Mặc định dịu mắt)',
                bg: '#e7eef7',
                text: '#0f172a',
                header: 'bg-[#f4f8fd]/95 border-b border-blue-200/80 backdrop-blur-md shadow-sm shadow-blue-900/5',
                card: 'bg-[#f8fbff] border border-blue-200/80 shadow-lg shadow-blue-950/5',
                subCard: 'bg-[#eef4fc] border border-blue-200/70',
                input: 'bg-[#f0f6fd] border border-blue-200 text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-blue-600 focus:border-blue-600',
                select: 'bg-[#f0f6fd] border border-blue-200 text-slate-800 focus:ring-2 focus:ring-blue-600',
                modelSelect: 'bg-blue-100/80 border border-blue-300/80 text-blue-950 focus:ring-2 focus:ring-blue-600',
                tabBar: 'bg-[#dce7f5] p-1.5',
                tabActive: 'bg-[#f8fbff] text-blue-800 shadow-sm',
                tabInactive: 'text-slate-600 hover:text-blue-800',
                primaryBtn: 'bg-blue-700 hover:bg-blue-800 text-white shadow-lg shadow-blue-700/20',
                secondaryBtn: 'bg-blue-100/90 hover:bg-blue-200/80 text-blue-900 border-2 border-blue-200',
                darkActionBtn: 'bg-slate-800 hover:bg-slate-900 text-white shadow-md shadow-slate-900/15',
                accentBadge: 'bg-blue-700 text-white',
                accentBar: 'bg-blue-700',
                accentText: 'text-blue-800',
                mutedText: 'text-slate-500',
                headingText: 'text-slate-900',
                passageText: 'text-slate-800',
                divider: 'border-blue-200/70',
                iconBtn: 'bg-[#e3ecf8] hover:bg-blue-200/70 text-blue-700 border border-blue-200/60',
                optionCard: 'bg-[#f4f8fe] border border-blue-200/80 text-slate-800 hover:border-blue-400',
                optionBadge: 'bg-blue-100 text-blue-800 border border-blue-200',
                answerBadge: 'bg-emerald-100/90 text-emerald-900 border border-emerald-300',
                guideBox: 'bg-[#eef5fd] border border-blue-300/80 text-blue-900',
                guideTitle: 'text-blue-800',
                emptyCircle: 'bg-[#e3ecf8] text-blue-400',
                emptyText: 'text-slate-400',
                switcherWrap: 'bg-[#dce7f5] border border-blue-200/80',
                switcherActive: 'bg-blue-700 text-white shadow-sm',
                switcherInactive: 'text-slate-600 hover:text-blue-900',
                infoPill: 'text-blue-700 bg-blue-100/90 border border-blue-200'
            },
            'paper-warm': {
                id: 'paper-warm',
                shortLabel: 'Paper',
                fullLabel: 'Reading Paper (Mặc định - Giấy đọc ngà ấm)',
                bg: '#ede8de',
                text: '#1c1917',
                header: 'bg-[#f7f3eb]/95 border-b border-stone-300/80 backdrop-blur-md shadow-sm shadow-stone-900/5',
                card: 'bg-[#faf7f0] border border-stone-300/80 shadow-lg shadow-stone-900/5',
                subCard: 'bg-[#f2ece1] border border-stone-300/70',
                input: 'bg-[#f4efe6] border border-stone-300 text-stone-800 placeholder-stone-400 focus:ring-2 focus:ring-blue-800',
                select: 'bg-[#f4efe6] border border-stone-300 text-stone-800 focus:ring-2 focus:ring-blue-800',
                modelSelect: 'bg-amber-100/70 border border-stone-300 text-stone-900 focus:ring-2 focus:ring-blue-800',
                tabBar: 'bg-[#e5dec9] p-1.5',
                tabActive: 'bg-[#faf7f0] text-blue-900 shadow-sm',
                tabInactive: 'text-stone-600 hover:text-stone-900',
                primaryBtn: 'bg-blue-800 hover:bg-blue-900 text-white shadow-lg shadow-blue-900/20',
                secondaryBtn: 'bg-[#efe8d8] hover:bg-[#e6decb] text-blue-950 border-2 border-stone-300',
                darkActionBtn: 'bg-stone-800 hover:bg-stone-900 text-[#faf7f0] shadow-md shadow-stone-900/15',
                accentBadge: 'bg-blue-800 text-white',
                accentBar: 'bg-blue-800',
                accentText: 'text-blue-900',
                mutedText: 'text-stone-500',
                headingText: 'text-stone-900',
                passageText: 'text-stone-800',
                divider: 'border-stone-300/70',
                iconBtn: 'bg-[#ebe4d5] hover:bg-[#e0d7c3] text-blue-900 border border-stone-300/70',
                optionCard: 'bg-[#f6f2e9] border border-stone-300/80 text-stone-800 hover:border-blue-700',
                optionBadge: 'bg-blue-100/80 text-blue-900 border border-blue-200',
                answerBadge: 'bg-emerald-100 text-emerald-900 border border-emerald-300',
                guideBox: 'bg-[#f4efe4] border border-amber-300/90 text-stone-800',
                guideTitle: 'text-amber-900',
                emptyCircle: 'bg-[#ebe4d5] text-stone-400',
                emptyText: 'text-stone-400',
                switcherWrap: 'bg-[#e5dec9] border border-stone-300/80',
                switcherActive: 'bg-blue-800 text-white shadow-sm',
                switcherInactive: 'text-stone-600 hover:text-stone-900',
                infoPill: 'text-blue-900 bg-amber-100/80 border border-stone-300'
            },
            'dark-slate': {
                id: 'dark-slate',
                shortLabel: 'Dark',
                fullLabel: 'Dark Slate (Chế độ ban đêm)',
                bg: '#0b1120',
                text: '#e2e8f0',
                header: 'bg-[#11192e]/95 border-b border-slate-800 backdrop-blur-md shadow-md shadow-black/30',
                card: 'bg-[#151f36] border border-slate-800 shadow-xl shadow-black/25',
                subCard: 'bg-[#1b2742] border border-slate-700/80',
                input: 'bg-[#0f172a] border border-slate-700 text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-sky-500',
                select: 'bg-[#0f172a] border border-slate-700 text-slate-100 focus:ring-2 focus:ring-sky-500',
                modelSelect: 'bg-[#1b2742] border border-slate-700 text-sky-300 focus:ring-2 focus:ring-sky-500',
                tabBar: 'bg-[#0f172a] p-1.5',
                tabActive: 'bg-[#1e293b] text-sky-400 shadow-sm',
                tabInactive: 'text-slate-400 hover:text-slate-200',
                primaryBtn: 'bg-sky-600 hover:bg-sky-500 text-white shadow-lg shadow-sky-950/50',
                secondaryBtn: 'bg-[#1b2742] hover:bg-[#233254] text-sky-300 border-2 border-slate-700',
                darkActionBtn: 'bg-sky-600 hover:bg-sky-500 text-white shadow-md shadow-black/30',
                accentBadge: 'bg-sky-500 text-slate-950',
                accentBar: 'bg-sky-400',
                accentText: 'text-sky-400',
                mutedText: 'text-slate-400',
                headingText: 'text-slate-100',
                passageText: 'text-slate-200',
                divider: 'border-slate-800',
                iconBtn: 'bg-[#1b2742] hover:bg-[#243456] text-sky-400 border border-slate-700',
                optionCard: 'bg-[#11192e] border border-slate-700/90 text-slate-200 hover:border-sky-500',
                optionBadge: 'bg-sky-950 text-sky-300 border border-sky-800',
                answerBadge: 'bg-emerald-950/90 text-emerald-300 border border-emerald-800',
                guideBox: 'bg-[#17223b] border border-sky-900/80 text-slate-300',
                guideTitle: 'text-sky-400',
                emptyCircle: 'bg-[#1b2742] text-slate-600',
                emptyText: 'text-slate-500',
                switcherWrap: 'bg-[#0f172a] border border-slate-800',
                switcherActive: 'bg-sky-600 text-white shadow-sm',
                switcherInactive: 'text-slate-400 hover:text-slate-200',
                infoPill: 'text-sky-300 bg-sky-950/90 border border-sky-800'
            }
        };

        // Danh sách các model hỗ trợ Free API Key từ Google AI Studio
        const AVAILABLE_MODELS = [
            { id: 'gemini-2.5-flash', name: 'Gemini 2.5 Flash (Khuyên dùng - Ổn định)' },
            { id: 'gemini-2.5-flash-lite', name: 'Gemini 2.5 Flash-Lite (Nhanh - Quota cao)' },
            { id: 'gemini-3-flash-preview', name: 'Gemini 3 Flash Preview' },
            { id: 'gemini-3.1-flash-lite-preview', name: 'Gemini 3.1 Flash-Lite Preview' }
        ];

        const QUESTION_CONFIG_META = [
            { id: 'mcq', shortTitle: 'MCQs', label: 'Trắc nghiệm 4 lựa chọn (MCQs)' },
            { id: 'tf', shortTitle: 'True / False', label: 'Đúng / Sai (True / False)' },
            { id: 'qa', shortTitle: 'Answer Questions', label: 'Trả lời câu hỏi (Wh-Questions)' }
        ];

        const CEFR_LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
        const PASSAGE_FORMATS = ['General Passage', 'Informal Email', 'Formal Email', 'Public Notice', 'Advertisement', 'Short News Article', 'Memo', 'Text Message Chain', 'Blog Post', 'Product Review'];
        const COMMON_TOPICS = ['Technology', 'Environment', 'Health', 'Education', 'Travel', 'Culture', 'History', 'Business'];
        const GRADE_DATA = {
            '6': { label: 'Lớp 6', topics: ['My New School', 'My Home', 'My Friends', 'Favorite Holidays', 'A Day in My Life', 'School Clubs', 'My Pet'], wordCount: '80-100', skills: 'Describing places, people, and routines.' },
            '7': { label: 'Lớp 7', topics: ['My Hobbies', 'Health & Fitness', 'Community Service', 'School Life Around the World', 'Favorite Foods', 'Planning a Weekend Trip'], wordCount: '100-120', skills: 'Expressing opinions, discussing problems.' },
            '8': { label: 'Lớp 8', topics: ['Leisure Activities', 'City Life vs. Country Life', 'Review of a New Movie', 'A School Event', 'Global Customs and Traditions', 'A Pen Pal'], wordCount: '120-150', skills: 'Comparing lifestyles, describing traditions.' },
            '9': { label: 'Lớp 9', topics: ['Local Environment Issues', 'Future Cities', 'Teen Stress and Pressure', 'Natural Wonders of the World', 'A Part-time Job', 'Planning a Group Project'], wordCount: '150-180', skills: 'Discussing environmental issues, handling social pressures.' },
            '10': { label: 'Lớp 10', topics: ['The Impact of AI', 'Globalization', 'Lifelong Learning', 'The Changing World of Work', 'The Influence of Social Media', 'Requesting Information'], wordCount: '180-200', skills: 'Developing arguments, understanding complex texts.' },
            '11': { label: 'Lớp 11', topics: ['Genetic Engineering', 'Space Exploration', 'Preserving Cultural Heritage', 'Global Social Issues', 'Solving Environmental Challenges', 'Making a Formal Complaint'], wordCount: '200-220', skills: 'Analyzing different viewpoints, synthesizing information.' },
            '12': { label: 'Lớp 12', topics: ['Career Orientation Advice', 'Comparing Higher Education Systems', 'Protecting the Environment for the Future', 'Technological Advancements and Society', 'Preparing for Independent Life', 'A University Application Inquiry'], wordCount: '220-250', skills: 'Critical thinking, evaluating sources, formal writing.' },
        };

        const SparklesIcon = ({ className }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m11-13v4m-2-2h4m2 11h-4m2 2v-4M12 2v2m-2 18v2M7.7 7.7l1.4-1.4M17.7 7.7l-1.4-1.4M7.7 16.3l1.4 1.4M17.7 16.3l-1.4 1.4" />
            </svg>
        );
        // Logo monogram RC (Reading Comprehension) phong cách học thuật
        const BrandRCIcon = ({ className }) => (
            <svg className={className} viewBox="0 0 36 36" fill="none">
                <rect x="2.5" y="2.5" width="31" height="31" rx="8" stroke="currentColor" strokeWidth="1.75" strokeOpacity="0.35" />
                <text
                    x="18"
                    y="22.5"
                    textAnchor="middle"
                    fill="currentColor"
                    fontFamily="'Inter', system-ui, sans-serif"
                    fontWeight="900"
                    fontSize="14.5"
                    letterSpacing="-0.6"
                >
                    RC
                </text>
                <path d="M11 27.5Q14.5 26.2 18 27.5Q21.5 26.2 25 27.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
            </svg>
        );
        const ShuffleIcon = ({ className }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        );
        const SpinnerIcon = ({ className }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24">
                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        );
        const InfoIcon = ({ className }) => (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const Select = ({ label, value, onChange, children, info, theme }) => (
            <div className="space-y-1.5">
                <div className="flex justify-between items-end">
                    <label className={`text-[11px] font-black uppercase tracking-wider ${theme.mutedText}`}>{label}</label>
                    {info && <span className={`text-[10px] font-bold px-2.5 py-0.5 rounded-full ${theme.infoPill}`}>{info}</span>}
                </div>
                <select value={value} onChange={onChange} className={`w-full text-sm font-semibold rounded-xl p-3 outline-none transition-all cursor-pointer ${theme.select}`}>
                    {children}
                </select>
            </div>
        );

        // Làm sạch tiền tố A., B., C., D. nếu AI tự chèn vào option
        const cleanOptionText = (text) => String(text || '').replace(/^[A-Da-d][\.\)\:\-]\s*/, '').trim();

        // Escape HTML để tránh lỗi ký tự đặc biệt khi xuất Rich Text cho Word
        const escapeHtml = (str) => String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');

        const App = () => {
            const [themeKey, setThemeKey] = useState('paper-warm');
            const theme = THEMES[themeKey] || THEMES['paper-warm'];

            const [selectedModel, setSelectedModel] = useState(AVAILABLE_MODELS[0].id);
            const [apiKey, setApiKey] = useState('');
            const [isKeyVerified, setIsKeyVerified] = useState(false);
            const [isVerifying, setIsVerifying] = useState(false);
            
            const [mode, setMode] = useState('cefr');
            const [cefrLevel, setCefrLevel] = useState(CEFR_LEVELS[1]);
            const [cefrPassageFormat, setCefrPassageFormat] = useState(PASSAGE_FORMATS[0]);
            const [commonTopic, setCommonTopic] = useState(COMMON_TOPICS[0]);
            const [customTopic, setCustomTopic] = useState('');
            const [wordCount, setWordCount] = useState(150);
            
            const [grade, setGrade] = useState('6');
            const [gradeTopic, setGradeTopic] = useState(GRADE_DATA['6'].topics[0]);
            const [gradePassageFormat, setGradePassageFormat] = useState(PASSAGE_FORMATS[0]);

            // Cấu hình chọn nhiều dạng câu hỏi & số lượng cùng lúc ngay bên cột trái
            const [questionSettings, setQuestionSettings] = useState({
                mcq: { enabled: true, count: 4 },
                tf: { enabled: false, count: 4 },
                qa: { enabled: false, count: 3 }
            });
            
            const [passage, setPassage] = useState('');
            const [vocabList, setVocabList] = useState([]);
            const [questionSections, setQuestionSections] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [statusMsg, setStatusMsg] = useState({ type: '', text: '' });

            // Đồng bộ màu nền body theo theme đang chọn
            useEffect(() => {
                document.body.style.backgroundColor = theme.bg;
                document.body.style.color = theme.text;
            }, [theme]);

            useEffect(() => {
                try {
                    const savedKey = localStorage.getItem('gemini_api_key_v31');
                    const savedModel = localStorage.getItem('gemini_selected_model_v34');
                    const savedTheme = localStorage.getItem('ai_passage_theme_v37');
                    if (savedKey) { setApiKey(savedKey); setIsKeyVerified(true); }
                    if (savedModel && AVAILABLE_MODELS.some(m => m.id === savedModel)) {
                        setSelectedModel(savedModel);
                    }
                    if (savedTheme && THEMES[savedTheme]) {
                        setThemeKey(savedTheme);
                    }
                } catch (e) {}
            }, []);

            useEffect(() => {
                if (GRADE_DATA[grade]) setGradeTopic(GRADE_DATA[grade].topics[0]);
            }, [grade]);

            const handleThemeChange = (newTheme) => {
                setThemeKey(newTheme);
                try {
                    localStorage.setItem('ai_passage_theme_v37', newTheme);
                } catch (e) {}
            };

            const showToast = (type, text, duration = 4000) => {
                setStatusMsg({ type, text });
                if (duration > 0) {
                    setTimeout(() => setStatusMsg({ type: '', text: '' }), duration);
                }
            };

            const handleModelChange = (newModel) => {
                setSelectedModel(newModel);
                try {
                    localStorage.setItem('gemini_selected_model_v34', newModel);
                } catch (e) {}
            };

            const handleRandomizeCefr = () => {
                setCefrPassageFormat(PASSAGE_FORMATS[Math.floor(Math.random() * PASSAGE_FORMATS.length)]);
                setCommonTopic(COMMON_TOPICS[Math.floor(Math.random() * COMMON_TOPICS.length)]);
            };

            const handleRandomizeGrade = () => {
                setGradePassageFormat(PASSAGE_FORMATS[Math.floor(Math.random() * PASSAGE_FORMATS.length)]);
                const topics = GRADE_DATA[grade].topics;
                setGradeTopic(topics[Math.floor(Math.random() * topics.length)]);
            };

            const toggleQuestionType = (typeId) => {
                setQuestionSettings(prev => ({
                    ...prev,
                    [typeId]: { ...prev[typeId], enabled: !prev[typeId].enabled }
                }));
            };

            const updateQuestionCount = (typeId, newCount) => {
                const safeCount = Math.min(10, Math.max(1, Number(newCount) || 1));
                setQuestionSettings(prev => ({
                    ...prev,
                    [typeId]: { ...prev[typeId], count: safeCount }
                }));
            };

            const testSingleModel = async (keyToTest, modelId) => {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${keyToTest.trim()}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: 'Hi' }] }],
                        generationConfig: { maxOutputTokens: 5 }
                    })
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data?.error?.message || `HTTP ${response.status}`);
                }
                return true;
            };

            const verifyKey = async () => {
                const cleanKey = apiKey.trim();
                if (!cleanKey) return;
                setIsVerifying(true);
                setStatusMsg({ type: '', text: '' });

                const modelsToTry = [
                    selectedModel,
                    ...AVAILABLE_MODELS.map(m => m.id).filter(id => id !== selectedModel)
                ];

                let lastError = '';
                let workingModel = null;

                for (const modelId of modelsToTry) {
                    try {
                        await testSingleModel(cleanKey, modelId);
                        workingModel = modelId;
                        break;
                    } catch (err) {
                        lastError = err.message;
                        if (lastError.toLowerCase().includes('api key not valid') || lastError.toLowerCase().includes('api_key_invalid')) {
                            break;
                        }
                    }
                }

                if (workingModel) {
                    setApiKey(cleanKey);
                    setIsKeyVerified(true);
                    setSelectedModel(workingModel);
                    try {
                        localStorage.setItem('gemini_api_key_v31', cleanKey);
                        localStorage.setItem('gemini_selected_model_v34', workingModel);
                    } catch (e) {}

                    if (workingModel !== selectedModel) {
                        showToast('success', `✅ Đã xác thực! Tự động chuyển sang ${workingModel} do model cũ giới hạn Free Tier.`, 6000);
                    } else {
                        showToast('success', `✅ Xác thực thành công với ${workingModel}!`, 3500);
                    }
                } else {
                    setIsKeyVerified(false);
                    showToast('error', `❌ Lỗi API: ${lastError}`, 8000);
                }
                setIsVerifying(false);
            };

            const callGemini = async (prompt, isJson = false) => {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey.trim()}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            ...(isJson && { generationConfig: { responseMimeType: "application/json" } })
                        })
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        const msg = data?.error?.message || `HTTP ${response.status}`;
                        throw new Error(msg);
                    }
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) throw new Error('AI không trả về nội dung (có thể bị chặn bộ lọc an toàn).');
                    return text;
                } catch (e) {
                    showToast('error', `❌ Lỗi (${selectedModel}): ${e.message}. Thầy hãy thử đổi Model khác ở góc trên!`, 8000);
                    return null;
                }
            };

            const handleGeneratePassage = async () => {
                if (mode === 'cefr' && commonTopic === 'Custom' && !customTopic.trim()) {
                    showToast('error', '⚠️ Vui lòng nhập chủ đề tùy chỉnh trước khi tạo bài.');
                    return;
                }

                const activeQuestionTypes = QUESTION_CONFIG_META.filter(q => questionSettings[q.id]?.enabled);

                setIsLoading(true);
                setPassage('');
                setVocabList([]);
                setQuestionSections([]);

                const targetLevel = mode === 'cefr' ? cefrLevel : 'Grade ' + grade;
                const format = mode === 'cefr' ? cefrPassageFormat : gradePassageFormat;
                const topic = mode === 'cefr' ? (commonTopic === 'Custom' ? customTopic : commonTopic) : gradeTopic;
                const length = mode === 'cefr' ? wordCount : GRADE_DATA[grade].wordCount;

                // Xây dựng yêu cầu chi tiết cho từng loại câu hỏi được chọn
                let questionPromptInstructions = '';
                if (activeQuestionTypes.length > 0) {
                    const specs = activeQuestionTypes.map(qt => {
                        const cnt = questionSettings[qt.id].count;
                        if (qt.id === 'mcq') {
                            return `- Section "mcq": Generate ${cnt} Multiple Choice Questions (4 options A, B, C, D). Do NOT include "A."/"B." prefixes in options strings. Put full answer text or letter in "answer".`;
                        }
                        if (qt.id === 'tf') {
                            return `- Section "tf": Generate ${cnt} True / False statements based on the passage. Set "answer" to "True" or "False", and provide brief evidence from the text in "explanation".`;
                        }
                        return `- Section "qa": Generate ${cnt} comprehension questions (Answer the Questions / Wh-questions) with concise suggested answers in "answer".`;
                    }).join('\n');

                    questionPromptInstructions = `3. "sections": Generate comprehension exercises strictly matching these selected sections in order:\n${specs}`;
                } else {
                    questionPromptInstructions = `3. "sections": Return an empty array [].`;
                }

                const p = `Task: Create an English reading passage, extract 10 key vocabulary/structures, AND generate the requested reading comprehension exercises in ONE single response.
                Target Level: ${targetLevel}.
                Format: ${format}.
                Topic: ${topic}.
                Length: ~${length} words.
                Rules:
                1. "passage": PLAIN TEXT ONLY. NO markdown symbols (no *, #, **). Title in UPPERCASE on the first line, followed by a blank line and well-structured paragraphs.
                2. "vocabulary": Exactly 10 useful words, collocations, phrasal verbs, or grammar structures from the passage tailored to ${targetLevel}, with Vietnamese meaning and short example.
                ${questionPromptInstructions}
                4. NO markdown symbols anywhere in the JSON values.
                Output ONLY valid JSON with this exact schema:
                {
                  "passage": "...",
                  "vocabulary": [
                    { "term": "...", "pos": "n / v / adj / phr.v / structure", "meaning": "nghĩa tiếng Việt", "example": "..." }
                  ],
                  "sections": [
                    {
                      "type": "mcq | tf | qa",
                      "questions": [
                        {
                          "question": "question text (for mcq & qa)",
                          "statement": "statement text (for tf)",
                          "options": ["opt 1", "opt 2", "opt 3", "opt 4"],
                          "answer": "...",
                          "explanation": "evidence from passage (for tf)"
                        }
                      ]
                    }
                  ]
                }`;

                const result = await callGemini(p, true);
                if (result) {
                    try {
                        const parsed = JSON.parse(result.replace(/```json/g, '').replace(/```/g, '').trim());
                        if (parsed && parsed.passage) {
                            setPassage(parsed.passage.trim());
                            setVocabList(Array.isArray(parsed.vocabulary) ? parsed.vocabulary : []);
                            setQuestionSections(Array.isArray(parsed.sections) ? parsed.sections : []);
                        } else {
                            throw new Error('Thiếu nội dung bài đọc');
                        }
                    } catch (e) {
                        setPassage(result.trim());
                        setVocabList([]);
                        setQuestionSections([]);
                    }
                }
                setIsLoading(false);
            };

            // Tạo nội dung Plain Text thuần túy
            const buildPlainTextContent = () => {
                let fullText = `READING PASSAGE\n\n${passage}\n\n`;

                if (vocabList && vocabList.length > 0) {
                    fullText += `KEY VOCABULARY & STRUCTURES\n\n`;
                    vocabList.forEach((v, idx) => {
                        const posPart = v.pos ? ` (${v.pos})` : '';
                        fullText += `${idx + 1}. ${v.term}${posPart}: ${v.meaning}`;
                        if (v.example) fullText += ` — Ex: ${v.example}`;
                        fullText += `\n`;
                    });
                    fullText += `\n`;
                }

                if (questionSections && questionSections.length > 0) {
                    let answerKeyBlocks = [];

                    questionSections.forEach((sec) => {
                        const qList = sec.questions || [];
                        if (qList.length === 0) return;

                        if (sec.type === 'mcq') {
                            fullText += `PART: MULTIPLE CHOICE QUESTIONS\n\n`;
                            let ansLines = [`[MCQs Answer Key]`];
                            qList.forEach((q, i) => {
                                fullText += `${i + 1}. ${q.question}\n`;
                                (q.options || []).forEach((opt, oi) => {
                                    fullText += `   ${String.fromCharCode(65 + oi)}. ${cleanOptionText(opt)}\n`;
                                });
                                fullText += `\n`;
                                ansLines.push(`${i + 1}. ${q.answer}`);
                            });
                            answerKeyBlocks.push(ansLines.join('\n'));
                        } else if (sec.type === 'tf') {
                            fullText += `PART: TRUE / FALSE STATEMENTS\n\n`;
                            let ansLines = [`[True / False Answer Key]`];
                            qList.forEach((q, i) => {
                                fullText += `${i + 1}. ${q.statement || q.question}  (True / False)\n`;
                                ansLines.push(`${i + 1}. ${q.answer}${q.explanation ? ` (${q.explanation})` : ''}`);
                            });
                            fullText += `\n`;
                            answerKeyBlocks.push(ansLines.join('\n'));
                        } else {
                            fullText += `PART: ANSWER THE QUESTIONS\n\n`;
                            let ansLines = [`[Suggested Answers]`];
                            qList.forEach((q, i) => {
                                fullText += `${i + 1}. ${q.question}\n`;
                                ansLines.push(`${i + 1}. ${q.answer}`);
                            });
                            fullText += `\n`;
                            answerKeyBlocks.push(ansLines.join('\n'));
                        }
                    });

                    if (answerKeyBlocks.length > 0) {
                        fullText += `ANSWER KEY & SUGGESTED ANSWERS\n\n${answerKeyBlocks.join('\n\n')}\n`;
                    }
                }
                return fullText.trim();
            };

            // Tạo nội dung Rich HTML chuẩn định dạng Microsoft Word
            const buildWordRichHtml = () => {
                const lines = passage.split('\n').filter(l => l.trim() !== '');
                const titleLine = lines[0] || '';
                const bodyParagraphs = lines.slice(1);

                let html = `<div style="font-family: 'Segoe UI', Calibri, Arial, sans-serif; font-size: 11.5pt; color: #1e293b; line-height: 1.6;">`;
                
                // Khối bài đọc
                html += `<h2 style="color: #1d4ed8; font-size: 14pt; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid #1d4ed8; padding-bottom: 4px; margin-bottom: 10px;">READING PASSAGE</h2>`;
                if (titleLine) {
                    html += `<p style="font-size: 13pt; font-weight: bold; color: #0f172a; margin: 8px 0 12px 0; text-align: center;">${escapeHtml(titleLine)}</p>`;
                }
                bodyParagraphs.forEach(p => {
                    html += `<p style="margin: 0 0 10px 0; text-align: justify;">${escapeHtml(p)}</p>`;
                });

                // Bảng từ vựng trọng tâm
                if (vocabList && vocabList.length > 0) {
                    html += `<h3 style="color: #1d4ed8; font-size: 12.5pt; font-weight: bold; text-transform: uppercase; margin-top: 20px; margin-bottom: 8px; border-bottom: 1px solid #93c5fd; padding-bottom: 3px;">KEY VOCABULARY &amp; STRUCTURES</h3>`;
                    html += `<table style="width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 10.5pt;">`;
                    html += `<thead><tr style="background-color: #dbeafe; color: #1e3a8a;">
                        <th style="border: 1px solid #93c5fd; padding: 6px 8px; text-align: left; width: 28%;">Word / Structure</th>
                        <th style="border: 1px solid #93c5fd; padding: 6px 8px; text-align: left; width: 32%;">Meaning</th>
                        <th style="border: 1px solid #93c5fd; padding: 6px 8px; text-align: left; width: 40%;">Example / Context</th>
                    </tr></thead><tbody>`;
                    vocabList.forEach((v, idx) => {
                        const rowBg = idx % 2 === 0 ? '#ffffff' : '#f8fafc';
                        const posBadge = v.pos ? ` <span style="color: #2563eb; font-style: italic; font-weight: normal;">(${escapeHtml(v.pos)})</span>` : '';
                        html += `<tr style="background-color: ${rowBg};">
                            <td style="border: 1px solid #cbd5e1; padding: 6px 8px; font-weight: bold; color: #0f172a;">${idx + 1}. ${escapeHtml(v.term)}${posBadge}</td>
                            <td style="border: 1px solid #cbd5e1; padding: 6px 8px; color: #1e293b;">${escapeHtml(v.meaning)}</td>
                            <td style="border: 1px solid #cbd5e1; padding: 6px 8px; font-style: italic; color: #475569;">${escapeHtml(v.example || '')}</td>
                        </tr>`;
                    });
                    html += `</tbody></table>`;
                }

                // Các phần bài tập đọc hiểu
                if (questionSections && questionSections.length > 0) {
                    let answerBlocksHtml = '';

                    questionSections.forEach((sec) => {
                        const qList = sec.questions || [];
                        if (qList.length === 0) return;

                        if (sec.type === 'mcq') {
                            html += `<h3 style="color: #1d4ed8; font-size: 12.5pt; font-weight: bold; text-transform: uppercase; margin-top: 18px; margin-bottom: 8px; border-bottom: 1px solid #93c5fd; padding-bottom: 3px;">PART: MULTIPLE CHOICE QUESTIONS</h3>`;
                            answerBlocksHtml += `<p style="font-weight: bold; color: #1e3a8a; margin: 8px 0 4px 0;">• Multiple Choice Questions:</p>`;
                            qList.forEach((q, i) => {
                                html += `<p style="font-weight: bold; color: #0f172a; margin: 10px 0 4px 0;">${i + 1}. ${escapeHtml(q.question)}</p>`;
                                (q.options || []).forEach((opt, oi) => {
                                    html += `<p style="margin: 2px 0 2px 18px; color: #1e293b;"><b>${String.fromCharCode(65 + oi)}.</b> ${escapeHtml(cleanOptionText(opt))}</p>`;
                                });
                                answerBlocksHtml += `<p style="margin: 2px 0 2px 14px; color: #065f46;"><b>${i + 1}.</b> ${escapeHtml(q.answer)}</p>`;
                            });
                        } else if (sec.type === 'tf') {
                            html += `<h3 style="color: #1d4ed8; font-size: 12.5pt; font-weight: bold; text-transform: uppercase; margin-top: 18px; margin-bottom: 8px; border-bottom: 1px solid #93c5fd; padding-bottom: 3px;">PART: TRUE / FALSE STATEMENTS</h3>`;
                            answerBlocksHtml += `<p style="font-weight: bold; color: #1e3a8a; margin: 8px 0 4px 0;">• True / False:</p>`;
                            qList.forEach((q, i) => {
                                html += `<p style="margin: 6px 0; color: #0f172a;"><b>${i + 1}.</b> ${escapeHtml(q.statement || q.question)} &nbsp;&nbsp;<i>(True / False)</i></p>`;
                                const ev = q.explanation ? ` <span style="color: #475569; font-style: italic;">— Dẫn chứng: ${escapeHtml(q.explanation)}</span>` : '';
                                answerBlocksHtml += `<p style="margin: 2px 0 2px 14px; color: #065f46;"><b>${i + 1}. ${escapeHtml(q.answer)}</b>${ev}</p>`;
                            });
                        } else {
                            html += `<h3 style="color: #1d4ed8; font-size: 12.5pt; font-weight: bold; text-transform: uppercase; margin-top: 18px; margin-bottom: 8px; border-bottom: 1px solid #93c5fd; padding-bottom: 3px;">PART: ANSWER THE QUESTIONS</h3>`;
                            answerBlocksHtml += `<p style="font-weight: bold; color: #1e3a8a; margin: 8px 0 4px 0;">• Suggested Answers:</p>`;
                            qList.forEach((q, i) => {
                                html += `<p style="font-weight: bold; margin: 8px 0 4px 0; color: #0f172a;">${i + 1}. ${escapeHtml(q.question)}</p>`;
                                html += `<p style="margin: 2px 0 8px 18px; color: #94a3b8;">&rarr; ........................................................................................................................</p>`;
                                answerBlocksHtml += `<p style="margin: 3px 0 3px 14px; color: #065f46;"><b>${i + 1}.</b> ${escapeHtml(q.answer)}</p>`;
                            });
                        }
                    });

                    if (answerBlocksHtml) {
                        html += `<div style="margin-top: 22px; padding: 10px 14px; background-color: #f0fdf4; border: 1px solid #86efac; border-radius: 6px;">`;
                        html += `<h3 style="color: #166534; font-size: 12pt; font-weight: bold; text-transform: uppercase; margin: 0 0 6px 0;">ANSWER KEY &amp; SUGGESTED ANSWERS</h3>`;
                        html += answerBlocksHtml;
                        html += `</div>`;
                    }
                }

                html += `</div>`;
                return html;
            };

            // Copy văn bản thuần túy (Plain Text)
            const handleCopyPlainText = async () => {
                if (!passage) return;
                const plainText = buildPlainTextContent();
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = plainText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('success', '✅ Đã copy văn bản thuần (Plain Text)!', 2500);
                } catch (err) {
                    if (navigator.clipboard) {
                        await navigator.clipboard.writeText(plainText);
                        showToast('success', '✅ Đã copy văn bản thuần (Plain Text)!', 2500);
                    }
                }
            };

            // Copy giữ nguyên định dạng Rich Text cho Microsoft Word
            const handleCopyWordRich = async () => {
                if (!passage) return;
                const plainText = buildPlainTextContent();
                const htmlContent = buildWordRichHtml();

                try {
                    if (navigator.clipboard && window.ClipboardItem) {
                        const htmlBlob = new Blob([htmlContent], { type: 'text/html' });
                        const textBlob = new Blob([plainText], { type: 'text/plain' });
                        await navigator.clipboard.write([
                            new ClipboardItem({
                                'text/html': htmlBlob,
                                'text/plain': textBlob
                            })
                        ]);
                        showToast('success', '✅ Đã copy định dạng đẹp cho Word! Dán (Ctrl+V) vào Word ngay.', 3000);
                        return;
                    }
                } catch (err) {
                    // Fallback dùng selection DOM nếu iframe chặn ClipboardItem
                }

                try {
                    const container = document.createElement('div');
                    container.innerHTML = htmlContent;
                    container.style.position = 'fixed';
                    container.style.left = '-9999px';
                    container.style.top = '0';
                    container.style.backgroundColor = '#ffffff';
                    document.body.appendChild(container);

                    const range = document.createRange();
                    range.selectNodeContents(container);
                    const selection = window.getSelection();
                    selection.removeAllRanges();
                    selection.addRange(range);
                    document.execCommand('copy');
                    selection.removeAllRanges();
                    document.body.removeChild(container);

                    showToast('success', '✅ Đã copy định dạng đẹp cho Word! Dán (Ctrl+V) vào Word ngay.', 3000);
                } catch (fallbackErr) {
                    await handleCopyPlainText();
                }
            };

            const totalSelectedQuestions = QUESTION_CONFIG_META.reduce(
                (sum, item) => sum + (questionSettings[item.id]?.enabled ? questionSettings[item.id].count : 0),
                0
            );

            return (
                <div className="min-h-screen transition-colors duration-300">
                    {/* Header Education Style */}
                    <header className={`py-4 mb-8 sticky top-0 z-50 transition-all ${theme.header}`}>
                        <div className="max-w-7xl mx-auto px-4 flex flex-col xl:flex-row justify-between items-center gap-4">
                            {/* Brand */}
                            <div className="flex items-center gap-3.5 w-full xl:w-auto justify-between sm:justify-start">
                                <div className="flex items-center gap-3.5">
                                    <div className={`p-1.5 rounded-2xl shadow-md flex items-center justify-center ${theme.primaryBtn}`}>
                                        <BrandRCIcon className="w-9 h-9" />
                                    </div>
                                    <div>
                                        <h1 className={`text-xl sm:text-2xl font-black leading-tight ${theme.headingText}`}>AI Passage Generator</h1>
                                        <div className="flex items-center gap-2 mt-0.5">
                                            <span className={`text-[10px] font-black px-2 py-0.5 rounded-md uppercase tracking-wider ${theme.accentBadge}`}>V3.7 EDU</span>
                                            <span className={`text-xs font-bold ${theme.mutedText}`}>• Mr. Anh Đinh</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Nút chuyển đổi 3 giao diện (Hiện trên mobile bên cạnh logo) */}
                                <div className={`flex sm:hidden items-center p-1 rounded-xl ${theme.switcherWrap}`}>
                                    {Object.values(THEMES).map((t) => (
                                        <button
                                            key={t.id}
                                            onClick={() => handleThemeChange(t.id)}
                                            title={t.fullLabel}
                                            className={`px-2.5 py-1.5 text-[11px] font-black rounded-lg transition-all ${themeKey === t.id ? theme.switcherActive : theme.switcherInactive}`}
                                        >
                                            {t.shortLabel}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            
                            {/* Controls: Theme Switcher + Model + API Key */}
                            <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5 w-full xl:w-auto">
                                {/* Bộ 3 nút tùy chọn giao diện (Desktop & Tablet) */}
                                <div className={`hidden sm:flex items-center p-1 rounded-xl shrink-0 ${theme.switcherWrap}`} title="Chuyển đổi giao diện chống chói">
                                    {Object.values(THEMES).map((t) => (
                                        <button
                                            key={t.id}
                                            onClick={() => handleThemeChange(t.id)}
                                            title={t.fullLabel}
                                            className={`px-3 py-1.5 text-xs font-black rounded-lg transition-all cursor-pointer ${themeKey === t.id ? theme.switcherActive : theme.switcherInactive}`}
                                        >
                                            {t.shortLabel}
                                        </button>
                                    ))}
                                </div>

                                <select
                                    value={selectedModel}
                                    onChange={(e) => handleModelChange(e.target.value)}
                                    title="Chọn Model Gemini"
                                    className={`px-3.5 py-2.5 text-xs font-bold rounded-xl outline-none cursor-pointer transition-all ${theme.modelSelect}`}
                                >
                                    {AVAILABLE_MODELS.map(m => (
                                        <option key={m.id} value={m.id}>{m.name}</option>
                                    ))}
                                </select>

                                <div className="flex items-center gap-2 flex-1">
                                    <input 
                                        type="password" 
                                        placeholder="Dán API Key AI Studio..." 
                                        value={apiKey}
                                        onChange={(e) => { setApiKey(e.target.value); setIsKeyVerified(false); }}
                                        className={`flex-1 sm:w-52 px-3.5 py-2.5 text-sm rounded-xl outline-none transition-all font-mono ${theme.input}`}
                                    />
                                    <button 
                                        onClick={verifyKey} 
                                        disabled={isVerifying || !apiKey.trim()}
                                        className={`px-5 py-2.5 text-sm font-black rounded-xl btn-hover shrink-0 cursor-pointer ${isKeyVerified ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-md shadow-emerald-900/15' : `${theme.darkActionBtn} disabled:opacity-50`}`}
                                    >
                                        {isVerifying ? <SpinnerIcon className="w-4 h-4 animate-spin" /> : (isKeyVerified ? 'Verified ✓' : 'Verify')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-8 pb-20">
                        
                        {/* Cột trái: Cấu hình & Hướng dẫn */}
                        <div className="lg:col-span-4 space-y-6">
                            
                            {!isKeyVerified && (
                                <div className={`p-5 rounded-3xl transition-all ${theme.guideBox}`}>
                                    <div className="flex items-center gap-2 mb-3">
                                        <InfoIcon className={`w-5 h-5 ${theme.guideTitle}`} />
                                        <h3 className={`font-black uppercase text-[11px] tracking-wider ${theme.guideTitle}`}>Hướng dẫn lấy API Key miễn phí</h3>
                                    </div>
                                    <ol className="text-[11px] font-semibold space-y-2 list-decimal ml-4 opacity-90">
                                        <li>Truy cập <b><a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer" className="underline">aistudio.google.com/apikey</a></b></li>
                                        <li>Nhấn <b>Create API key</b> và sao chép mã.</li>
                                        <li>Dán mã vào ô ở trên, nhấn <b>Verify</b>.</li>
                                        <li>Nếu báo hết lượt (Quota), hãy đổi sang <b>Gemini 2.5 Flash-Lite</b>.</li>
                                    </ol>
                                </div>
                            )}

                            <div className={`p-6 rounded-[2rem] transition-all ${theme.card}`}>
                                <div className={`flex rounded-2xl mb-7 ${theme.tabBar}`}>
                                    <button onClick={() => setMode('cefr')} className={`flex-1 py-2.5 text-xs font-black rounded-xl transition-all cursor-pointer ${mode === 'cefr' ? theme.tabActive : theme.tabInactive}`}>Khung CEFR</button>
                                    <button onClick={() => setMode('grade')} className={`flex-1 py-2.5 text-xs font-black rounded-xl transition-all cursor-pointer ${mode === 'grade' ? theme.tabActive : theme.tabInactive}`}>Hệ Lớp (6-12)</button>
                                </div>

                                <div className="space-y-6">
                                    {mode === 'cefr' ? (
                                        <div className="space-y-5">
                                            <Select theme={theme} label="Trình độ" value={cefrLevel} onChange={(e) => setCefrLevel(e.target.value)}>
                                                {CEFR_LEVELS.map(l => <option key={l} value={l}>{l}</option>)}
                                            </Select>
                                            <Select theme={theme} label="Định dạng văn bản" value={cefrPassageFormat} onChange={(e) => setCefrPassageFormat(e.target.value)}>
                                                {PASSAGE_FORMATS.map(f => <option key={f} value={f}>{f}</option>)}
                                            </Select>
                                            <Select theme={theme} label="Chủ đề" value={commonTopic} onChange={(e) => setCommonTopic(e.target.value)}>
                                                {COMMON_TOPICS.map(t => <option key={t} value={t}>{t}</option>)}
                                                <option value="Custom">Chủ đề tự nhập...</option>
                                            </Select>
                                            {commonTopic === 'Custom' && (
                                                <input type="text" value={customTopic} onChange={(e) => setCustomTopic(e.target.value)} placeholder="Nhập chủ đề tùy chỉnh..." className={`w-full text-sm font-medium rounded-xl p-3 outline-none transition-all ${theme.input}`} />
                                            )}
                                            <div className="flex items-center gap-3">
                                                <div className="flex-1">
                                                    <Select theme={theme} label="Độ dài (~)" value={wordCount} onChange={(e) => setWordCount(Number(e.target.value))}>
                                                        {[100, 150, 200, 250, 300].map(c => <option key={c} value={c}>{c} từ</option>)}
                                                    </Select>
                                                </div>
                                                <button onClick={handleRandomizeCefr} className={`mt-6 p-3 rounded-xl btn-hover cursor-pointer ${theme.iconBtn}`} title="Xáo trộn ngẫu nhiên">
                                                    <ShuffleIcon className="w-5 h-5" />
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="space-y-5">
                                            <Select theme={theme} label="Khối lớp" value={grade} onChange={(e) => setGrade(e.target.value)} info={`Từ: ${GRADE_DATA[grade].wordCount}`}>
                                                {Object.keys(GRADE_DATA).map(g => <option key={g} value={g}>{GRADE_DATA[g].label}</option>)}
                                            </Select>
                                            <div className={`p-3.5 rounded-xl ${theme.subCard}`}>
                                                <p className={`text-[10px] font-black uppercase mb-1 ${theme.accentText}`}>Mục tiêu kỹ năng</p>
                                                <p className={`text-xs font-semibold leading-relaxed ${theme.passageText}`}>{GRADE_DATA[grade].skills}</p>
                                            </div>
                                            <Select theme={theme} label="Định dạng văn bản" value={gradePassageFormat} onChange={(e) => setGradePassageFormat(e.target.value)}>
                                                {PASSAGE_FORMATS.map(f => <option key={f} value={f}>{f}</option>)}
                                            </Select>
                                            <div className="flex items-center gap-3">
                                                <div className="flex-1">
                                                    <Select theme={theme} label="Chủ đề học thuật" value={gradeTopic} onChange={(e) => setGradeTopic(e.target.value)}>
                                                        {GRADE_DATA[grade].topics.map(t => <option key={t} value={t}>{t}</option>)}
                                                    </Select>
                                                </div>
                                                <button onClick={handleRandomizeGrade} className={`mt-6 p-3 rounded-xl btn-hover cursor-pointer ${theme.iconBtn}`} title="Xáo trộn ngẫu nhiên">
                                                    <ShuffleIcon className="w-5 h-5" />
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {/* Cấu hình câu hỏi đọc hiểu đi kèm ngay khi Generate */}
                                    <div className={`pt-5 border-t ${theme.divider}`}>
                                        <div className="flex items-center justify-between mb-3">
                                            <label className={`text-[11px] font-black uppercase tracking-wider ${theme.mutedText}`}>
                                                Bài tập đi kèm (Chọn 1 hoặc nhiều)
                                            </label>
                                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${theme.infoPill}`}>
                                                {totalSelectedQuestions > 0 ? `${totalSelectedQuestions} câu` : 'Chỉ bài đọc'}
                                            </span>
                                        </div>

                                        <div className="space-y-2.5">
                                            {QUESTION_CONFIG_META.map((qt) => {
                                                const cfg = questionSettings[qt.id];
                                                return (
                                                    <div
                                                        key={qt.id}
                                                        className={`p-3 rounded-2xl border transition-all flex items-center justify-between gap-2 ${
                                                            cfg.enabled ? theme.optionCard : `${theme.subCard} opacity-65`
                                                        }`}
                                                    >
                                                        <label className="flex items-center gap-2.5 cursor-pointer flex-1 select-none">
                                                            <input
                                                                type="checkbox"
                                                                checked={cfg.enabled}
                                                                onChange={() => toggleQuestionType(qt.id)}
                                                                className="w-4 h-4 rounded accent-blue-700 cursor-pointer"
                                                            />
                                                            <span className={`text-xs font-bold ${theme.headingText}`}>
                                                                {qt.label}
                                                            </span>
                                                        </label>

                                                        {cfg.enabled && (
                                                            <div className="flex items-center gap-1.5 shrink-0">
                                                                <input
                                                                    type="number"
                                                                    min="1"
                                                                    max="10"
                                                                    value={cfg.count}
                                                                    onChange={(e) => updateQuestionCount(qt.id, e.target.value)}
                                                                    className={`w-14 text-center text-xs font-black rounded-lg py-1.5 px-1 outline-none ${theme.input}`}
                                                                />
                                                                <span className={`text-[10px] font-bold ${theme.mutedText}`}>câu</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className={`pt-5 border-t ${theme.divider}`}>
                                        <button 
                                            onClick={handleGeneratePassage} 
                                            disabled={isLoading || !isKeyVerified} 
                                            className={`w-full font-black py-4 rounded-2xl flex items-center justify-center gap-3 btn-hover disabled:opacity-50 cursor-pointer ${theme.primaryBtn}`}
                                        >
                                            {isLoading ? <SpinnerIcon className="w-6 h-6 animate-spin" /> : <SparklesIcon className="w-6 h-6" />}
                                            <span>TẠO TRỌN BỘ (1-CLICK)</span>
                                        </button>
                                        {statusMsg.text && (
                                            <p className={`text-[11px] mt-4 text-center font-bold p-3 rounded-xl break-words ${
                                                statusMsg.type === 'error' 
                                                    ? 'text-rose-700 bg-rose-100/90 border border-rose-300' 
                                                    : 'text-emerald-800 bg-emerald-100/90 border border-emerald-300'
                                            }`}>
                                                {statusMsg.text}
                                            </p>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Cột phải: Kết quả */}
                        <div className="lg:col-span-8 space-y-8">
                            <div className={`p-8 sm:p-10 rounded-[2.5rem] min-h-[420px] relative transition-all ${theme.card} ${passage ? '' : 'flex items-center justify-center'}`}>
                                {!passage && !isLoading ? (
                                    <div className="text-center">
                                        <div className={`w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-5 transition-colors ${theme.emptyCircle}`}>
                                            <BrandRCIcon className="w-12 h-12" />
                                        </div>
                                        <h3 className={`text-lg font-black uppercase tracking-widest ${theme.emptyText}`}>Sẵn sàng soạn giáo án</h3>
                                        <p className={`text-xs font-medium mt-1.5 ${theme.mutedText}`}>Chọn định dạng văn bản & các dạng câu hỏi bên trái, sau đó nhấn "Tạo trọn bộ (1-Click)"</p>
                                    </div>
                                ) : isLoading ? (
                                    <div className="text-center space-y-5">
                                        <SpinnerIcon className={`w-14 h-14 mx-auto animate-spin ${theme.accentText}`} />
                                        <p className={`font-black uppercase text-xs tracking-[0.2em] ${theme.mutedText}`}>AI ({selectedModel}) đang soạn bài đọc, từ vựng & bài tập...</p>
                                    </div>
                                ) : (
                                    <div>
                                        {/* Thanh tiêu đề & 2 nút Copy */}
                                        <div className={`flex flex-wrap justify-between items-center gap-3 mb-8 pb-5 border-b ${theme.divider}`}>
                                            <div className="flex items-center gap-3">
                                                <div className={`h-7 w-1.5 rounded-full ${theme.accentBar}`}></div>
                                                <h2 className={`text-xl sm:text-2xl font-black uppercase tracking-tight ${theme.headingText}`}>Reading Passage</h2>
                                            </div>
                                            <div className="flex flex-wrap items-center gap-2.5">
                                                <button 
                                                    onClick={handleCopyWordRich}
                                                    className={`font-black text-[11px] uppercase px-4 py-2.5 rounded-xl btn-hover cursor-pointer flex items-center gap-1.5 ${theme.primaryBtn}`}
                                                    title="Giữ nguyên màu sắc, in đậm, bảng từ vựng chuẩn đẹp khi dán vào Microsoft Word"
                                                >
                                                    <span>Copy Word (Rich Text)</span>
                                                </button>
                                                <button 
                                                    onClick={handleCopyPlainText}
                                                    className={`font-black text-[11px] uppercase px-4 py-2.5 rounded-xl btn-hover cursor-pointer ${theme.secondaryBtn}`}
                                                    title="Sao chép văn bản thuần túy không định dạng"
                                                >
                                                    <span>Copy Thường</span>
                                                </button>
                                            </div>
                                        </div>

                                        <p className={`text-lg sm:text-[19px] whitespace-pre-wrap passage-font ${theme.passageText}`}>{passage}</p>

                                        {/* Phần Key Vocabulary & Phrases đi kèm bài đọc */}
                                        {vocabList && vocabList.length > 0 && (
                                            <div className={`mt-10 pt-8 border-t ${theme.divider}`}>
                                                <div className="flex items-center justify-between gap-2 mb-5">
                                                    <div className="flex items-center gap-2.5">
                                                        <div className={`h-6 w-1.5 rounded-full ${theme.accentBar}`}></div>
                                                        <h3 className={`text-base sm:text-lg font-black uppercase tracking-tight ${theme.headingText}`}>
                                                            Key Vocabulary & Structures ({vocabList.length})
                                                        </h3>
                                                    </div>
                                                    <span className={`text-[10px] font-black uppercase px-2.5 py-1 rounded-full ${theme.infoPill}`}>
                                                        Từ vựng trọng tâm
                                                    </span>
                                                </div>

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                                                    {vocabList.map((item, idx) => (
                                                        <div key={idx} className={`p-4 rounded-2xl transition-all ${theme.subCard}`}>
                                                            <div className="flex flex-wrap items-baseline gap-2 mb-1">
                                                                <span className={`text-xs font-black ${theme.accentText}`}>{idx + 1}.</span>
                                                                <span className={`font-black text-base ${theme.headingText}`}>{item.term}</span>
                                                                {item.pos && (
                                                                    <span className={`text-[11px] font-bold italic px-2 py-0.5 rounded-md ${theme.optionBadge}`}>
                                                                        {item.pos}
                                                                    </span>
                                                                )}
                                                            </div>
                                                            <p className={`text-sm font-bold mb-1 ${theme.passageText}`}>{item.meaning}</p>
                                                            {item.example && (
                                                                <p className={`text-xs italic leading-relaxed ${theme.mutedText}`}>
                                                                    "{item.example}"
                                                                </p>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            {/* Khu vực hiển thị tất cả các phần câu hỏi đã tạo */}
                            {passage && !isLoading && questionSections && questionSections.length > 0 && (
                                <div className={`p-8 sm:p-10 rounded-[2.5rem] transition-all space-y-10 ${theme.card}`}>
                                    {questionSections.map((section, sIdx) => {
                                        const qList = section.questions || [];
                                        if (qList.length === 0) return null;
                                        const sectionTitle =
                                            section.type === 'mcq'
                                                ? 'Multiple Choice Questions (MCQs)'
                                                : section.type === 'tf'
                                                ? 'True / False Statements'
                                                : 'Answer the Questions';

                                        return (
                                            <div key={sIdx} className={sIdx > 0 ? `pt-8 border-t ${theme.divider}` : ''}>
                                                <div className="flex items-center justify-between gap-2 mb-6">
                                                    <div className="flex items-center gap-3">
                                                        <div className={`h-6 w-1.5 rounded-full ${theme.accentBar}`}></div>
                                                        <h3 className={`text-lg sm:text-xl font-black uppercase tracking-tight ${theme.headingText}`}>
                                                            {sectionTitle}
                                                        </h3>
                                                    </div>
                                                    <span className={`text-[10px] font-black uppercase px-2.5 py-1 rounded-full ${theme.infoPill}`}>
                                                        {qList.length} câu
                                                    </span>
                                                </div>

                                                <div className="space-y-5">
                                                    {qList.map((q, idx) => (
                                                        <div key={idx} className={`p-6 sm:p-7 rounded-[2rem] transition-all ${theme.subCard}`}>
                                                            {section.type === 'mcq' && (
                                                                <>
                                                                    <p className={`font-black mb-5 text-lg leading-snug ${theme.headingText}`}>{idx + 1}. {q.question}</p>
                                                                    <div className="space-y-3">
                                                                        {(q.options || []).map((opt, i) => (
                                                                            <div key={i} className={`p-4 rounded-2xl text-base flex items-start gap-4 transition-all ${theme.optionCard}`}>
                                                                                <span className={`font-mono font-black w-8 h-8 rounded-xl flex items-center justify-center shrink-0 text-sm ${theme.optionBadge}`}>{String.fromCharCode(65 + i)}</span> 
                                                                                <span className="pt-0.5 font-semibold leading-relaxed">{cleanOptionText(opt)}</span>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                    <div className={`mt-5 pt-4 border-t ${theme.divider}`}>
                                                                        <span className={`text-xs font-black uppercase px-4 py-1.5 rounded-full inline-block ${theme.answerBadge}`}>Đáp án đúng: {q.answer}</span>
                                                                    </div>
                                                                </>
                                                            )}

                                                            {section.type === 'tf' && (
                                                                <>
                                                                    <div className="flex flex-wrap items-start justify-between gap-4 mb-4">
                                                                        <p className={`font-bold text-lg leading-snug flex-1 ${theme.headingText}`}>
                                                                            {idx + 1}. {q.statement || q.question}
                                                                        </p>
                                                                        <div className="flex gap-2 shrink-0">
                                                                            <span className={`px-3.5 py-1.5 rounded-xl text-xs font-black ${String(q.answer).toLowerCase() === 'true' ? theme.answerBadge : theme.optionCard}`}>TRUE</span>
                                                                            <span className={`px-3.5 py-1.5 rounded-xl text-xs font-black ${String(q.answer).toLowerCase() === 'false' ? theme.answerBadge : theme.optionCard}`}>FALSE</span>
                                                                        </div>
                                                                    </div>
                                                                    <div className={`mt-4 pt-4 border-t flex flex-wrap items-center gap-3 ${theme.divider}`}>
                                                                        <span className={`text-xs font-black uppercase px-3.5 py-1.5 rounded-full ${theme.answerBadge}`}>
                                                                            Đáp án: {q.answer}
                                                                        </span>
                                                                        {q.explanation && (
                                                                            <span className={`text-xs font-semibold italic ${theme.mutedText}`}>
                                                                                Dẫn chứng: {q.explanation}
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                </>
                                                            )}

                                                            {section.type === 'qa' && (
                                                                <>
                                                                    <p className={`font-black mb-4 text-lg leading-snug ${theme.headingText}`}>
                                                                        {idx + 1}. {q.question}
                                                                    </p>
                                                                    <div className={`p-4 rounded-2xl text-sm sm:text-base font-semibold leading-relaxed ${theme.optionCard}`}>
                                                                        <span className={`text-xs font-black uppercase px-2.5 py-1 rounded-lg mr-2.5 ${theme.answerBadge}`}>
                                                                            Gợi ý trả lời
                                                                        </span>
                                                                        {q.answer}
                                                                    </div>
                                                                </>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })}

                                    {/* 2 nút Copy lặp lại ở cuối trang cho tiện thao tác */}
                                    <div className={`pt-6 border-t flex flex-wrap justify-center gap-3 ${theme.divider}`}>
                                        <button 
                                            className={`px-8 py-4 font-black text-xs uppercase tracking-wider rounded-2xl btn-hover cursor-pointer ${theme.primaryBtn}`}
                                            onClick={handleCopyWordRich}
                                        >
                                            Copy Word (Rich Format)
                                        </button>
                                        <button 
                                            className={`px-8 py-4 font-black text-xs uppercase tracking-wider rounded-2xl btn-hover cursor-pointer ${theme.secondaryBtn}`}
                                            onClick={handleCopyPlainText}
                                        >
                                            Copy Bình Thường (Plain Text)
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    
                    <footer className={`text-center py-8 text-[10px] font-black uppercase tracking-[0.25em] ${theme.mutedText}`}>
                        &copy; 2026 ESL Education Tool • Mr. Anh Đinh
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
